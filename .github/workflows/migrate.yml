name: Apply Supabase migration

# Runs every supabase/migrations/NNNN_*.sql file, in order, against the live
# database whenever one changes on main. Each one is written to be safely
# re-run, on its own or as part of the whole set - none of them drop existing
# data, only recreate their own tables/functions/policies.
#
# PlantShare lives in the "plantshare" schema of the HouseHero Supabase project
# (the free plan allows two active projects). The SQL runs through the Supabase
# Management API with SUPABASE_ACCESS_TOKEN, so no database password is needed.
# The project ref is public (it is in every URL the app calls), so it is set
# here rather than as a secret.
#
# The PASTE_... placeholders in 0001_init.sql are substituted into a scratch
# copy at run time and the copy is discarded when the job ends. The committed
# file itself must always keep saying PASTE_PROJECT_REF_HERE and
# PASTE_VAPID_PRIVATE_KEY_HERE (see supabase/migrations/size.test.ts).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

env:
  PROJECT_REF: axamojjnbhygnclqihhe
  # Where the app is served from; sign-in may only redirect back to these.
  APP_URLS: https://pinhasziv.github.io/PlantShare-Solo/**,https://pinhasziv.github.io/plantshare-solo/**

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN and VAPID_PRIVATE_KEY as repository secrets. See SETUP.md."
            exit 1
          fi

      - name: Substitute secrets into scratch copies
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/migrations"
          for file in supabase/migrations/*.sql; do
            sed \
              -e "s|PASTE_PROJECT_REF_HERE|${PROJECT_REF}|" \
              -e "s|PASTE_VAPID_PRIVATE_KEY_HERE|${VAPID_PRIVATE_KEY}|" \
              "$file" > "$RUNNER_TEMP/migrations/$(basename "$file")"
          done

      - name: Apply migrations
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Sorted by filename, so 0001 always runs before 0002 and so on.
          for file in "$RUNNER_TEMP"/migrations/*.sql; do
            echo "::group::$(basename "$file")"
            jq -Rs '{query: .}' "$file" > "$RUNNER_TEMP/body.json"
            status=$(curl -sS -o "$RUNNER_TEMP/response.json" -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @"$RUNNER_TEMP/body.json")
            echo "HTTP $status"
            if [ "$status" -ge 300 ]; then
              # The response is the database error; it never contains the
              # substituted secret (that is only in the request body).
              cat "$RUNNER_TEMP/response.json"
              exit 1
            fi
            echo "::endgroup::"
          done
          rm -f "$RUNNER_TEMP/body.json"

      - name: Expose the plantshare schema to the API
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          api="https://api.supabase.com/v1/projects/${PROJECT_REF}/postgrest"
          current=$(curl -sSf "$api" -H "Authorization: Bearer ${TOKEN}" | jq -r '.db_schema')
          echo "Exposed schemas: $current"
          if ! echo ",$current," | tr -d ' ' | grep -q ',plantshare,'; then
            jq -n --arg s "$current, plantshare" '{db_schema: $s}' |
              curl -sSf -X PATCH "$api" -H "Authorization: Bearer ${TOKEN}" \
                -H 'Content-Type: application/json' --data-binary @- > /dev/null
            echo "Added plantshare"
          fi

      - name: Allow sign-in to return to the app
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          api="https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth"
          current=$(curl -sSf "$api" -H "Authorization: Bearer ${TOKEN}" | jq -r '.uri_allow_list // ""')
          merged=$(printf '%s,%s' "$current" "$APP_URLS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | awk '!seen[$0]++' | paste -sd, -)
          if [ "$merged" != "$current" ]; then
            jq -n --arg l "$merged" '{uri_allow_list: $l}' |
              curl -sSf -X PATCH "$api" -H "Authorization: Bearer ${TOKEN}" \
                -H 'Content-Type: application/json' --data-binary @- > /dev/null
            echo "Redirect URLs updated"
          else
            echo "Redirect URLs already include the app"
          fi
