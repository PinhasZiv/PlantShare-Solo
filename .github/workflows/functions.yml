name: Deploy Supabase functions

# Pushes the Edge Functions to Supabase whenever they change, so the whole
# project can be maintained from a browser without installing anything.
#
# Needs one repository secret:
#   SUPABASE_ACCESS_TOKEN  from https://supabase.com/dashboard/account/tokens
#
# PlantShare shares the HouseHero Supabase project (schema "plantshare"), so
# the functions carry a plantshare- prefix to stay apart from HouseHero's own.
# The project ref is public, so it is set here rather than as a secret.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/functions.yml'
  workflow_dispatch:

env:
  PROJECT_REF: axamojjnbhygnclqihhe

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN as a repository secret. See SETUP.md."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy plantshare-send-reminders --project-ref "$PROJECT_REF"
          supabase functions deploy plantshare-send-test --project-ref "$PROJECT_REF"
